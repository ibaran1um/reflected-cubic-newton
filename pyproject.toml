[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcn"
version = "0.0.1"
description = "Cubic Newton with sign-reflected negative-curvature steps"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ibaran1um" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "scipy",
]

[tool.setuptools]
packages = ["rcn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
