# E4 sensitivity to the activation threshold eta (joint mode).
# eta = 0 must coincide with cn (sanity check).
name: e4

_methods: &methods
  - {name: cn, method: cn}
  - {name: eta_0, method: rcn, mode: joint, eta: 0.0}
  - {name: eta_0.1, method: rcn, mode: joint, eta: 0.1}
  - {name: eta_0.5, method: rcn, mode: joint, eta: 0.5}
  - {name: eta_1, method: rcn, mode: joint, eta: 1.0}
  - {name: eta_inf, method: rcn, mode: joint, eta: .inf}

_common: &common
  R: auto
  M: {lipschitz_multiple: [1.0, 3.0]}
  methods: *methods
  solver: {eps_g: 1.0e-8, max_iter: 200}
  seeds: {start: 0, count: 100}
  save_iters: false

groups:
  - <<: *common
    label: saddle_tensor
    problem: saddle_tensor
    grid: {cubic: [0.3, 1.0]}
    fixed: {n: 20, n_neg: 3, c: 1.0, start_scale: 1.0e-6}
  - <<: *common
    label: matrix_factorization
    problem: matrix_factorization
    fixed: {d: 20, r: 2, start_scale: 1.0e-3}
  - <<: *common
    label: phase_retrieval
    problem: phase_retrieval
    fixed: {n: 20, m: 100, start_scale: 1.0e-3}
  - <<: *common
    label: small_mlp
    problem: small_mlp
    fixed: {d_in: 5, hidden: 20, n_data: 200, start_scale: 1.0e-3}
  - <<: *common
    label: test_functions
    problem: test_functions
    grid: {fn: [himmelblau, cubic_saddle]}
    fixed: {start_scale: 1.0e-6}
